<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Menú digital con platos en 3D y pedidos desde la mesa.">
<meta name="theme-color" content="#b5832f">
<meta property="og:title" content="Brasa &amp; Grano · Menú digital 3D">
<meta property="og:description" content="Mirá cada plato en 3D sobre tu mesa y pedí desde el celular.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8D%BD%3C/text%3E%3C/svg%3E">
<title>Brasa & Grano · Menú digital</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ee;--card:#fff;--ink:#2b2018;--mut:#7a6b5d;--gold:#b5832f;--gold2:#8f6420;--line:#eadfce;--on:#fff;--sh:0 2px 14px rgba(70,45,10,.09);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120e;--card:#221b15;--ink:#f4ecdf;--mut:#b2a493;--gold:#d6a24b;--gold2:#e6b863;--line:#3a2f25;--on:#1b1410;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17120e;--card:#221b15;--ink:#f4ecdf;--mut:#b2a493;--gold:#d6a24b;--gold2:#e6b863;--line:#3a2f25;--on:#1b1410;--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:150px}
body{background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif;max-width:640px;margin:0 auto;padding-bottom:110px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 16px 0;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:1.4rem;line-height:1.1}.top small{color:var(--mut);display:block;font-family:'DM Sans',sans-serif;font-weight:400;font-size:.8rem}
.quick{display:flex;gap:8px}
.q{border:1.5px solid var(--gold);color:var(--gold2);border-radius:999px;padding:7px 12px;font-size:.82rem;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:500;color:var(--mut)}
.tab[aria-selected=true]{background:var(--gold);border-color:var(--gold);color:var(--on);font-weight:700}
main{padding:18px 16px;display:grid;gap:16px}
main>h2{font-size:1.5rem}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--line)}
.ph{height:150px;display:grid;place-items:center;font-size:4.6rem;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.bd{padding:14px 16px 16px;display:grid;gap:8px}
.bd h3{font-size:1.2rem}.bd p{color:var(--mut);font-size:.92rem}
.tg{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(181,131,47,.15);color:var(--gold2)}
.tag.v{background:rgba(70,140,70,.16);color:#3f8a3f}.tag.s{background:rgba(70,110,170,.16);color:#4a78c0}
.ft{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.ft b{font-family:Fraunces,serif;font-size:1.25rem}
.btn{background:var(--gold);color:var(--on);padding:10px 16px;border-radius:12px;font-weight:700}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.ov{position:fixed;inset:0;z-index:40;background:rgba(20,12,5,.55);display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:94%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sh{animation:none}}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.sh-h h2{font-size:1.25rem}
.x{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:1.1rem}
.sb{overflow-y:auto;padding:16px;display:grid;gap:18px}
.sf{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;background:var(--bg)}
.sf .btn{flex:1;padding:14px}
.grp h4{font-family:Fraunces,serif;font-size:1.02rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.grp h4 span{font:700 .72rem 'DM Sans',sans-serif;color:var(--gold2);background:rgba(181,131,47,.15);padding:2px 9px;border-radius:999px}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-height:48px}
.row span.n{flex:1}.row em{font-style:normal;color:var(--mut);font-size:.88rem}
.row input{width:22px;height:22px;accent-color:var(--gold);flex:none}
.ct{display:flex;align-items:center;gap:4px}
.ct button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold2);font-size:1.2rem;font-weight:700;line-height:1}
.ct b{min-width:24px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none;max-width:640px;margin:0 auto}
.bar.on{display:block}
.bar button{width:100%;display:flex;justify-content:space-between;background:var(--ink);color:var(--bg);padding:15px 20px;border-radius:16px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.28)}
.line{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.line small{color:var(--mut);grid-column:1/-1;font-size:.82rem}
.line .rm{color:#b3402f;font-size:.82rem;font-weight:700}
.tot{display:flex;justify-content:space-between;font-family:Fraunces,serif;font-size:1.3rem}
.mesa label{font-weight:700;display:block;margin-bottom:6px}
.mesa input{width:100%;padding:14px;font-size:1.1rem;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.mesa input.err{border-color:#c0392b}
.mesa p{color:#c0392b;font-size:.85rem;margin-top:4px;display:none}.mesa input.err+p{display:block}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.ok{text-align:center;padding:30px 10px;display:grid;gap:10px}.ok div{font-size:3.2rem}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:60;font-size:.92rem;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Brasa &amp; Grano<small>Escaneá, elegí y pedí desde tu mesa</small></h1>
    <div class="quick">
      <button class="q" onclick="call('mozo')">Llamar al mozo</button>
      <button class="q" onclick="call('cuenta')">Pedir la cuenta</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Categorías"></nav>
</header>
<main id="list"></main>

<div class="bar" id="bar"><button onclick="openCart()"><span id="bn">Ver pedido</span><span id="bt"></span></button></div>

<div class="ov" id="md" onclick="if(event.target===this)closeAll()"><div class="sh" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="sh-h"><h2 id="mt"></h2><button class="x" onclick="closeAll()" aria-label="Cerrar">✕</button></div>
  <div class="sb" id="mb"></div>
  <div class="sf"><div class="ct"><button onclick="dq(-1)" aria-label="Menos">−</button><b id="mq">1</b><button onclick="dq(1)" aria-label="Más">+</button></div><button class="btn" id="add" onclick="addCart()"></button></div>
</div></div>

<div class="ov" id="cv" onclick="if(event.target===this)closeAll()"><div class="sh" role="dialog" aria-modal="true" aria-labelledby="ct">
  <div class="sh-h"><h2 id="ct">Tu pedido</h2><button class="x" onclick="closeAll()" aria-label="Cerrar">✕</button></div>
  <div class="sb" id="cb"></div>
  <div class="sf" id="cf"><button class="btn" onclick="send()">Enviar pedido a cocina</button></div>
</div></div>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s),f=n=>'$ '+n.toLocaleString('es-AR');
const CATS=[['carnes','Carnes rojas','linear-gradient(135deg,#e9c9a0,#c98b5a)'],['pastas','Pastas','linear-gradient(135deg,#f6e3a8,#e1b552)'],['burgers','Hamburguesas','linear-gradient(135deg,#f3cf9b,#d9903f)'],['cafe','Cafetería','linear-gradient(135deg,#dcc3a6,#a7794f)'],['bebidas','Bebidas','linear-gradient(135deg,#cfe6d8,#8cc3a2)'],['postres','Postres','linear-gradient(135deg,#f0d0d6,#d99aa8)']];
const COC={k:'Punto de cocción',req:1,o:[['Jugoso',0],['A punto',0],['Bien cocido',0]]};
const GU=(x=0)=>({k:'Guarnición',req:1,o:[['Papas fritas',0],['Ensalada mixta',0],['Puré de papa',0],['Papas rústicas al romero',x||1200]]});
const D=[
{id:1,c:'carnes',n:'Bife de chorizo',e:'🥩',p:14500,t:['s','c'],d:'350 g de bife de lomo de novillo grillado a las brasas, con sal gruesa y chimichurri casero (perejil, ajo, ají molido, vinagre de vino y aceite de oliva).',g:[GU(),COC],i:['Chimichurri casero','Sal gruesa','Limón'],x:[{n:'Huevo frito',p:900,d:0,max:3},{n:'Provoleta',p:2200,d:0,max:2}]},
{id:2,c:'carnes',n:'Ojo de bife',e:'🥩',p:16900,t:['s'],d:'400 g de ojo de bife marmoleado, sellado en hierro y terminado con manteca de hierbas (romero, tomillo y ajo).',g:[GU(),COC],i:['Manteca de hierbas','Flor de sal'],x:[{n:'Salsa de malbec',p:1100,d:0,max:2}]},
{id:3,c:'carnes',n:'Entraña a la parrilla',e:'🍖',p:13800,t:['s'],d:'300 g de entraña tierna con marinada de ajo y limón. Se sirve con salsa criolla de tomate, cebolla morrón y ají.',g:[GU(),COC],i:['Salsa criolla','Limón'],x:[{n:'Provoleta',p:2200,d:0,max:2}]},
{id:4,c:'pastas',n:'Ravioles de osobuco',e:'🍝',p:11200,t:['c'],d:'Pasta fresca rellena de osobuco braseado 8 horas, con salsa de tomates asados, parmesano rallado y albahaca. Contiene gluten, huevo y lácteos.',g:[{k:'Salsa',req:1,o:[['Tomates asados',0],['Crema y panceta',900],['Manteca y salvia',0]]}],i:['Parmesano rallado','Albahaca fresca'],x:[{n:'Porción extra de queso',p:600,d:0,max:3}]},
{id:5,c:'pastas',n:'Sorrentinos veganos',e:'🍅',p:10400,t:['v'],d:'Masa sin huevo rellena de calabaza asada, nueces y tofu ahumado, con salsa pomodoro y aceite de oliva. No contiene lácteos ni huevo.',g:[],i:['Nueces tostadas','Albahaca','Aceite de oliva'],x:[]},
{id:6,c:'burgers',n:'Mequinesse Burger',e:'🍔',p:9800,t:['c'],d:'Pan de papa brioche, medallones smash de carne vacuna (120 g c/u), queso cheddar, bacon crocante y nuestra salsa Mequinesse (mayonesa, mostaza, pickles y pimentón ahumado).',g:[GU(900)],i:['Pan','Salsa Mequinesse','Bacon','Lechuga','Tomate','Pickles'],x:[{n:'Carne',p:2800,d:2,min:1,max:4},{n:'Queso cheddar',p:700,d:2,max:4},{n:'Cebolla crispy',p:500,d:0,max:1}]},
{id:7,c:'burgers',n:'Veggie Garden',e:'🥬',p:9200,t:['v'],d:'Medallón de lentejas, avena y remolacha, pan de papa vegano, palta, rúcula, tomate y mayonesa de anacardos.',g:[GU(900)],i:['Pan vegano','Palta','Rúcula','Tomate','Mayonesa de anacardos'],x:[{n:'Cebolla crispy',p:500,d:0,max:1}]},
{id:8,c:'cafe',n:'Cappuccino',e:'☕',p:3600,t:['c'],d:'Doble espresso de blend de granos 100% arábica (Colombia y Brasil) con leche texturizada y espuma cremosa.',g:[{k:'Tipo de leche',req:1,o:[['Entera',0],['Descremada',0],['Almendras',700],['Avena',700]]},{k:'Tamaño',req:1,o:[['Chico',0],['Grande',800]]}],i:['Canela'],x:[{n:'Shot extra de espresso',p:800,d:0,max:2}]},
{id:9,c:'cafe',n:'Medialunas de manteca',e:'🥐',p:3200,t:[],d:'Tres medialunas de hojaldre y manteca, horneadas cada mañana y bañadas con almíbar. Contienen gluten, huevo y lácteos.',g:[],i:['Almíbar'],x:[{n:'Jamón y queso',p:1200,d:0,max:3}]},
{id:10,c:'bebidas',n:'Limonada con menta y jengibre',e:'🍋',p:4200,t:['v','s'],d:'Limones exprimidos al momento, menta fresca, jengibre rallado y soda. Endulzada con azúcar de caña, a elección.',g:[],i:['Azúcar de caña','Hielo','Menta'],x:[]},
{id:11,c:'bebidas',n:'Cerveza artesanal IPA',e:'🍺',p:5200,t:[],d:'Pinta de 473 ml de IPA de elaboración local, con notas cítricas y amargor medio. Contiene cebada.',g:[{k:'Formato',req:1,o:[['Vaso 330 ml',-1000],['Pinta 473 ml',0]]}],i:[],x:[]},
{id:12,c:'postres',n:'Flan casero con dulce de leche',e:'🍮',p:5400,t:['s','c'],d:'Flan de huevos y vainilla con caramelo, dulce de leche repostero y crema chantilly. Contiene lácteos y huevo.',g:[],i:['Crema chantilly','Dulce de leche'],x:[{n:'Dulce de leche extra',p:500,d:0,max:3}]},
{id:13,c:'postres',n:'Brownie tibio',e:'🍫',p:6100,t:['c'],d:'Brownie de chocolate semiamargo 70% y nueces, servido tibio con helado de crema americana y salsa de chocolate.',g:[],i:['Nueces','Helado de crema','Salsa de chocolate'],x:[]}
];
const TG={s:['Sin TACC','s'],v:['Vegano','v'],c:['Recom. del Chef','']};
let cat='carnes',cur=null,cart=[],uid=0;

function tabs(){$('#tabs').innerHTML=CATS.map(c=>`<button class="tab" role="tab" aria-selected="${c[0]===cat}" onclick="setCat('${c[0]}')">${c[1]}</button>`).join('')}
function setCat(c){cat=c;tabs();list();scrollTo({top:0,behavior:'smooth'})}
function list(){const C=CATS.find(c=>c[0]===cat);
$('#list').innerHTML=`<h2>${C[1]}</h2>`+D.filter(d=>d.c===cat).map(d=>`<article class="card"><div class="ph" style="background:${C[2]}">${d.img?`<img src="${d.img}" alt="${d.n}" loading="lazy">`:`<span aria-hidden="true">${d.e}</span>`}</div><div class="bd"><div class="tg">${d.t.map(t=>`<span class="tag ${TG[t][1]}">${TG[t][0]}</span>`).join('')}</div><h3>${d.n}</h3><p>${d.d}</p><div class="ft"><b>${f(d.p)}</b><button class="btn" onclick="openD(${d.id})">Personalizar / Pedir</button></div></div></article>`).join('')}

function openD(id){const d=D.find(x=>x.id===id);
cur={d,s:{},i:{},x:{},q:1};d.g.forEach((g,gi)=>cur.s[gi]=0);d.i.forEach((_,i)=>cur.i[i]=true);d.x.forEach((x,i)=>cur.x[i]=x.d);
$('#mt').textContent=d.n;$('#mq').textContent=1;
$('#mb').innerHTML=`<p style="color:var(--mut)">${d.d}</p>`+d.g.map((g,gi)=>`<div class="grp"><h4>${g.k}<span>Obligatorio</span></h4>${g.o.map((o,oi)=>`<label class="row"><input type="radio" name="g${gi}" ${oi===0?'checked':''} onchange="cur.s[${gi}]=${oi};upd()"><span class="n">${o[0]}</span>${o[1]?`<em>${o[1]>0?'+':'−'} ${f(Math.abs(o[1]))}</em>`:''}</label>`).join('')}</div>`).join('')
+(d.i.length?`<div class="grp"><h4>Ingredientes<span>Desmarcá para quitar</span></h4>${d.i.map((n,i)=>`<label class="row"><input type="checkbox" checked onchange="cur.i[${i}]=this.checked"><span class="n">${n}</span></label>`).join('')}</div>`:'')
+(d.x.length?`<div class="grp"><h4>Extras y cantidades<span>Opcional</span></h4>${d.x.map((x,i)=>x.max===1?`<label class="row"><input type="checkbox" ${x.d?'checked':''} onchange="cur.x[${i}]=this.checked?1:0;upd()"><span class="n">${x.n}</span><em>+ ${f(x.p)}</em></label>`:`<div class="row"><span class="n">${x.n}<br><em>${x.p?'+ '+f(x.p)+' c/u':''}${x.d?' · '+x.d+' incluidas':''}</em></span><div class="ct"><button onclick="cx(${i},-1)" aria-label="Menos ${x.n}">−</button><b id="x${i}">${x.d}</b><button onclick="cx(${i},1)" aria-label="Más ${x.n}">+</button></div></div>`).join('')}</div>`:'');
$('#mb').scrollTop=0;upd();show('md')}
function cx(i,n){const x=cur.d.x[i];cur.x[i]=Math.min(x.max,Math.max(x.min||0,cur.x[i]+n));$('#x'+i).textContent=cur.x[i];upd()}
function dq(n){cur.q=Math.max(1,cur.q+n);$('#mq').textContent=cur.q;upd()}
function unit(c){let t=c.d.p;c.d.x.forEach((x,i)=>t+=(c.x[i]-x.d)*x.p);c.d.g.forEach((g,gi)=>t+=g.o[c.s[gi]][1]);return t}
function upd(){$('#add').textContent='Agregar al pedido · '+f(unit(cur)*cur.q)}
function sum(c){const a=[];c.d.g.forEach((g,gi)=>a.push(g.o[c.s[gi]][0]));c.d.i.forEach((n,i)=>{if(!c.i[i])a.push('Sin '+n.toLowerCase())});c.d.x.forEach((x,i)=>{if(c.x[i]!==x.d)a.push(x.max===1?(c.x[i]?'Con '+x.n.toLowerCase():'Sin '+x.n.toLowerCase()):x.n+' ×'+c.x[i])});return a.join(' · ')}
function addCart(){cart.push({u:++uid,d:cur.d,s:{...cur.s},i:{...cur.i},x:{...cur.x},q:cur.q});closeAll();bar();toast(cur.d.n+' agregado al pedido')}

function bar(){const n=cart.reduce((a,c)=>a+c.q,0),t=cart.reduce((a,c)=>a+unit(c)*c.q,0);$('#bar').classList.toggle('on',n>0);$('#bn').textContent='Ver pedido ('+n+')';$('#bt').textContent=f(t)}
function openCart(){renderCart();show('cv')}
function renderCart(){const t=cart.reduce((a,c)=>a+unit(c)*c.q,0),m=$('#mesa')?$('#mesa').value:'';
if(!cart.length){$('#cb').innerHTML='<p class="empty">Todavía no agregaste nada. Elegí un plato del menú para empezar.</p>';$('#cf').style.display='none';return}
$('#cf').style.display='flex';
$('#cb').innerHTML=cart.map(c=>`<div class="line"><b>${c.d.n}</b><b>${f(unit(c)*c.q)}</b><small>${sum(c)}</small><div class="ct"><button onclick="cq(${c.u},-1)" aria-label="Menos">−</button><b>${c.q}</b><button onclick="cq(${c.u},1)" aria-label="Más">+</button></div><button class="rm" onclick="cq(${c.u},-99)">Quitar</button></div>`).join('')
+`<div class="tot"><span>Total</span><span>${f(t)}</span></div><div class="mesa"><label for="mesa">Número de mesa</label><input id="mesa" type="number" inputmode="numeric" min="1" max="99" placeholder="Ej: 12" value="${m||window._m||''}" oninput="window._m=this.value;this.classList.remove('err')"><p>Ingresá el número de tu mesa para enviar el pedido.</p></div><div class="mesa" style="margin-top:12px"><label for="nota">Notas para la cocina (opcional)</label><input id="nota" type="text" maxlength="140" placeholder="Ej: la carne bien cocida" value="${window._n||''}" oninput="window._n=this.value"></div>`}
function cq(u,n){const c=cart.find(x=>x.u===u);c.q+=n;if(c.q<1)cart=cart.filter(x=>x.u!==u);renderCart();bar();if(!cart.length)bar()}
function mesa(){const v=parseInt(window._m);return v>0?v:0}
function needMesa(){if(!cart.length&&!$('#cv').classList.contains('open'))renderEmptyMesa();const i=$('#mesa');if(i){i.classList.add('err');i.focus()}}
function send(){if(!mesa()){needMesa();return}
const n=Math.floor(Math.random()*900+100),t=cart.reduce((a,c)=>a+unit(c)*c.q,0);cart=[];bar();$('#cf').style.display='none';
$('#cb').innerHTML=`<div class="ok"><div>👨‍🍳</div><h2>¡Pedido enviado a cocina!</h2><p>Pedido #${n} · Mesa ${mesa()} · ${f(t)}</p><p style="color:var(--mut)">Te lo llevamos a la mesa en cuanto esté listo. Podés seguir pidiendo desde el menú.</p><button class="btn" onclick="closeAll()">Volver al menú</button></div>`}

    for (var i = 0; i < 5; i++) { var ic = mesh(new THREE.BoxGeometry(.2, .2, .2), mat(0xffffff, .1, { transparent: true, opacity: .55 }), (rnd() - .5) * .3, y + .7 + rnd() * .2, (rnd() - .5) * .3); ic.rotation.set(rnd(), rnd(), rnd()); g.add(ic); }
    for (var m = 0; m < 6; m++) leaf(g, (rnd() - .5) * .4, y + 1.07, (rnd() - .5) * .4, .12, 0x2f8a3a);
    var ls = mesh(new THREE.TorusGeometry(.2, .03, 10, 30), mat(0xf1c40f, .5), .38, y + 1.12, 0); ls.rotation.y = Math.PI / 2; g.add(ls);
    var ld = cyl(.19, .19, .02, mat(0xf8ec9a, .6), .38, y + 1.12, 0); ld.rotation.z = Math.PI / 2; g.add(ld);
    var sw = cyl(.025, .025, 1.45, mat(0x2fa05a, .5), .1, y + .78, .05); sw.rotation.z = -.18; g.add(sw);
    return g;
  }

  function dishBeer() {
    var g = new THREE.Group(); g.add(plate(.75, 0xefe8da)); var y = TOP;
    g.add(cyl(.43, .31, 1.15, glassMat(), 0, y + .58, 0));
    g.add(cyl(.41, .3, .85, mat(0xd88a1b, .15, { transparent: true, opacity: .92 }), 0, y + .45, 0));
    g.add(cyl(.42, .41, .2, mat(0xfaf4e4, .9), 0, y + 1.0, 0));
    for (var i = 0; i < 7; i++) g.add(ell(.1, .06, .1, mat(0xfaf4e4, .9), (rnd() - .5) * .5, y + 1.1, (rnd() - .5) * .5));
    return g;
  }

  function dishFlan() {
    var g = new THREE.Group(); g.add(plate());
    g.add(cyl(.78, .78, .02, mat(0xb35a14, .25, { transparent: true, opacity: .9 }), 0, TOP + .01, 0, 56));
    g.add(cyl(.42, .55, .5, mat(0xf2c25e, .55), 0, TOP + .25, 0, 56));
    g.add(cyl(.44, .44, .03, mat(0x93440e, .2), 0, TOP + .515, 0, 56));
    for (var i = 0; i < 10; i++) { var a = i / 10 * 6.28, d = ell(.05, .1 + rnd() * .08, .04, mat(0x93440e, .2), Math.cos(a) * .45, TOP + .43, Math.sin(a) * .45); d.rotation.y = -a; g.add(d); }
    var dl = new THREE.MeshPhysicalMaterial({ color: 0x8a4a1c, roughness: .3, clearcoat: .5 });
    g.add(ell(.16, .09, .16, dl, 0, TOP + .58, 0));
    for (var k = 0; k < 4; k++) g.add(ell(.11, .08, .11, mat(0xffffff, .9), Math.cos(k * 1.6 + .5) * .25, TOP + .56, Math.sin(k * 1.6 + .5) * .25));
    return g;
  }

  function dishBrownie() {
    var g = new THREE.Group(); g.add(plate());
    g.add(cyl(.8, .8, .02, new THREE.MeshPhysicalMaterial({ color: 0x1f0e07, roughness: .2, clearcoat: .8 }), 0, TOP + .01, 0, 56));
    var br = mesh(new THREE.BoxGeometry(.85, .34, .85), mat(0x3b2012, .85), 0, TOP + .17, 0); br.rotation.y = .3; g.add(br);
    var tl = mesh(new THREE.BoxGeometry(.8, .03, .8), mat(0x4e2c17, .9), 0, TOP + .35, 0); tl.rotation.y = .3; g.add(tl);
    for (var i = 0; i < 7; i++) { var n = mesh(new THREE.BoxGeometry(.1, .05, .08), mat(0xc59a62, .8), (rnd() - .5) * .6, TOP + .38, (rnd() - .5) * .6); n.rotation.y = rnd() * 3; g.add(n); }
    g.add(ell(.3, .28, .3, mat(0xf6e8c8, .7), 0, TOP + .62, 0));
    var dk = new THREE.MeshPhysicalMaterial({ color: 0x2a140a, roughness: .25, clearcoat: .7 });
    [[.2, .74], [.27, .62], [.24, .5]].forEach(function (r) { var t = mesh(new THREE.TorusGeometry(r[0], .02, 8, 28), dk, 0, TOP + r[1] - .02, 0); t.rotation.x = Math.PI / 2; g.add(t); });
    return g;
  }

  var BUILD = {
    1: function () { return dishSteak(1); }, 2: function () { return dishSteak(2); }, 3: function () { return dishSteak(3); },
    4: function () { return dishPasta(false); }, 5: function () { return dishPasta(true); },
    6: function () { return dishBurger(false); }, 7: function () { return dishBurger(true); },
    8: dishCapp, 9: dishMedialunas, 10: dishLemonade, 11: dishBeer, 12: dishFlan, 13: dishBrownie
  };

  /* ---------- escena ---------- */
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function camDist() { var asp = innerWidth / innerHeight; return Math.max(3.6, 3.45 / asp); }

  function resetView() {
    S.elev = .55; S.holder.position.set(0, 0, 0); S.scale = 1; S.base = 1; S.holder.visible = true;
    S.spin.rotation.y = 0; S.auto = true; S.calib = true; applyScale();
  }
  function onResize() {
    if (!S) return;
    var w = innerWidth, h = innerHeight;
    S.renderer.setSize(w, h, false); S.cam.aspect = w / h; S.cam.updateProjectionMatrix(); S.dist = camDist();
  }

  function buildScene(id) {
    var r = new THREE.WebGLRenderer({ canvas: cv, alpha: true, antialias: true });
    r.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    r.setSize(innerWidth, innerHeight, false);
    r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
    r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
    var scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, .1, 60);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a68, 1.25));
    var sun = new THREE.DirectionalLight(0xfff2dc, 2.2); sun.position.set(2.5, 5, 3); sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    var sc = sun.shadow.camera; sc.left = -2; sc.right = 2; sc.top = 2; sc.bottom = -2; sc.near = 1; sc.far = 14; sun.shadow.bias = -.0005;
    scene.add(sun); scene.add(sun.target);
    var holder = new THREE.Group(), spin = new THREE.Group();
    seed = 42;
    var model = (BUILD[id] || BUILD[1])();
    model.traverse(function (o) { if (o.isMesh) { o.castShadow = !(o.material && o.material.transparent); o.receiveShadow = true; } });
    spin.add(model); holder.add(spin); scene.add(holder);
    var ground = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShadowMaterial({ opacity: .38 }));
    ground.rotation.x = -Math.PI / 2; ground.position.y = -.001; ground.receiveShadow = true; holder.add(ground);
    S = { renderer: r, scene: scene, cam: cam, holder: holder, spin: spin, elev: .55, dist: camDist(), scale: 1, auto: true, raf: 0, ptr: new Map(), sun: sun, base: 1, placed: false, gyro: false, calib: true, qd: new THREE.Quaternion(), Y0: new THREE.Quaternion() };
    resetView(); bindGestures();
    (function loop() {
      if (!S) return;
      S.raf = requestAnimationFrame(loop);
      if (S.auto) S.spin.rotation.y += .006;
      if (lastEv && lastEv.beta != null) {
        devQuat(lastEv, S.qd);
        if (S.calib || !S.gyro) { S.gyro = true; S.calib = false; calibrate(); }
        S.cam.position.set(0, 0, 0);
        S.cam.quaternion.copy(S.Y0).multiply(S.qd);
      } else {
        if (S.gyro) { S.gyro = false; S.holder.visible = true; S.holder.position.set(0, 0, 0); S.base = 1; applyScale(); }
        S.cam.position.set(0, Math.sin(S.elev) * S.dist, Math.cos(S.elev) * S.dist);
        S.cam.lookAt(0, .25, 0);
      }
      S.renderer.render(S.scene, S.cam);
    })();
  }

  function bindGestures() {
    var P = S.ptr;
    cv.onpointerdown = function (e) {
      cv.setPointerCapture(e.pointerId);
      P.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: Date.now(), multi: false });
      if (P.size > 1) P.forEach(function (v) { v.multi = true; });
    };
    cv.onpointermove = function (e) {
      var p = P.get(e.pointerId); if (!p || !S) return;
      var dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (P.size === 1) {
        S.spin.rotation.y += dx * .01; if (!S.gyro) S.elev = clamp(S.elev + dy * .006, .12, 1.35);
      } else if (P.size === 2) {
        var o = null; P.forEach(function (v, k) { if (k !== e.pointerId) o = v; });
        var d0 = Math.hypot(p.x - o.x, p.y - o.y), d1 = Math.hypot(e.clientX - o.x, e.clientY - o.y);
        if (d0 > 0) { S.scale = clamp(S.scale * d1 / d0, .4, 2.6); applyScale(); }
        if (!S.gyro) {
          var k2 = 2 * S.dist * Math.tan(Math.PI / 8) / innerHeight / 2;
          S.holder.position.x = clamp(S.holder.position.x + dx * k2, -4, 4);
          S.holder.position.z = clamp(S.holder.position.z + dy * k2, -4, 4);
          applyScale();
        }
      }
      p.x = e.clientX; p.y = e.clientY;
    };
    cv.onpointerup = function (e) {
      var p = P.get(e.pointerId); P.delete(e.pointerId);
      if (p && S && S.gyro && !p.multi && Math.hypot(e.clientX - p.sx, e.clientY - p.sy) < 10 && Date.now() - p.t < 500) placeAt(e.clientX, e.clientY);
    };
    cv.onpointercancel = function (e) { P.delete(e.pointerId); };
    cv.onwheel = function (e) { e.preventDefault(); if (!S) return; S.scale = clamp(S.scale * Math.exp(-e.deltaY * .001), .4, 2.6); applyScale(); };
  }

  /* ---------- cámara ---------- */
  function startCam() {
    var md = navigator.mediaDevices;
    if (!md || !md.getUserMedia) { noCam(); return Promise.resolve(); }
    return md.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
      .then(function (s) {
        if (!ov.classList.contains('open')) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
        stream = s; vid.srcObject = s; var p = vid.play(); if (p && p.catch) p.catch(function () {});
      })
      .catch(noCam);
  }
  function noCam() {
    ov.classList.add('nocam');
    msg.textContent = 'No pudimos abrir la cámara en vivo. Tocá "Foto de tu mesa", sacá una foto y ponemos el plato encima.';
    msg.hidden = false; setTimeout(function () { msg.hidden = true; }, 6000);
  }

  /* ---------- abrir / cerrar ---------- */
  function loadThree() {
    if (THREE) return Promise.resolve(THREE);
    return import(THREE_URL).catch(function () { return import(THREE_URL2); })
      .then(function (m) { THREE = m; return m; });
  }

  function open3D(id) {
    var d = (window.D || (typeof D !== 'undefined' ? D : [])).find(function (x) { return x.id === id; });
    curId = id; ttl.textContent = d ? d.n : 'Vista 3D';
    ov.classList.remove('nocam'); ov.classList.add('open'); document.body.style.overflow = 'hidden';
    msg.textContent = 'Preparando el plato en 3D…'; msg.hidden = false;
    var cam = startOri().then(startCam);
    loadThree().then(function () {
      if (!ov.classList.contains('open')) return;
      buildScene(id);
      if (!ov.classList.contains('nocam')) msg.hidden = true;
      return cam;
    }).catch(function () {
      msg.textContent = 'No se pudo cargar el visor 3D. Revisá tu conexión e intentá de nuevo.'; msg.hidden = false;
    });
  }

  function close3D() {
    ov.classList.remove('open', 'nocam', 'photo'); document.body.style.overflow = '';
    if (photoUrl) { URL.revokeObjectURL(photoUrl); photoUrl = null; } bg.removeAttribute('src');
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    vid.srcObject = null; stopOri();
    if (S) {
      cancelAnimationFrame(S.raf);
      S.scene.traverse(function (o) {
        if (o.geometry) o.geometry.dispose();
        if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(function (m) { m.dispose(); });
      });
      S.renderer.dispose();
      if (S.renderer.forceContextLoss) S.renderer.forceContextLoss();
      S = null;
    }
    msg.hidden = true;
  }

  addEventListener('resize', onResize);
  addEventListener('orientationchange', function () { setTimeout(onResize, 250); });
  window.open3D = open3D;
})();
